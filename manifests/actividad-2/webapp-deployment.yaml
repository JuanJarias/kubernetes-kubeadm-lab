apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hola-mundo
  template:
    metadata:
      labels:
        app: hola-mundo
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      containers:
        - name: app-container
          image: docker.io/juanjarias2006/webapp:v1
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: webapp-configmap
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
